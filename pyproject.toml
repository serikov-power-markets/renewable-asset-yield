[project]
name = "assetyield"
version = "0.1.0"
description = "Wind and solar asset models from reanalysis weather to expected volume: data validation, power curves, wakes, hindcasts, P50/P90"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "pyarrow>=15", "scikit-learn>=1.4", "pvlib>=0.11", "py_wake>=2.6", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
